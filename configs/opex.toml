# ------------------------------------------------------------------------------
# 3. NEW PICK! SOCIAL & ADAPTIVE BOOKING PLATFORM — RECURRING MONTHLY OpEx
#    (Crucial Addition: Active from Month 5 [May-27] onward once Core Build Completes)
# Derivation:
#   - Once Milestone M4 (Core Product Complete, End of Month 4 / Apr 25, 2027) is
#     reached and the platform enters live operation in Month 5 (May-27), running
#     a production-grade platform serving 3,600+ monthly players and 1,500+ paying
#     members requires dedicated monthly recurring operating expenses:
#     1) Cloud Infrastructure & Managed DB/Redis Hosting (4.50M VND/mo mean):
#        AWS ap-southeast-1 / Viettel Cloud multi-AZ PostgreSQL, Redis cluster,
#        application containers, automated S3 backups, and Cloudflare Pro CDN/WAF.
#     2) Zalo ZNS / SMS OTP & Push Notification Messaging (2.20M VND/mo mean):
#        Phone OTP verification, booking confirmation ZNS messages (350–550 VND/msg),
#        and automated open-play matchmaking reminders.
#     3) Observability, CI/CD, Telemetry & Security SaaS (1.80M VND/mo mean):
#        Sentry error/performance monitoring, PostHog analytics, GitHub Actions CI
#        minutes, and SSL/domain/map APIs.
#     4) Ongoing Platform Maintenance, Patching & ML Calibration Retainer (10.00M VND/mo mean,
#        starting Month 7 [Jul-27] after the 6-month project timeline's Stage 6 hypercare ends):
#        Part-time DevOps/Full-Stack maintenance, security patching, mobile browser updates,
#        and monthly AdaptivePricing HistGBR retraining.
#     5) School/University Partnerships & Community League Management (8.00M VND/mo mean,
#        starting Month 5 [May-27] per Case Page 3 Path C description):
#        Campus ambassador stipends, university club partnership activations, and
#        beginner league administration.
#   - Total Recurring New Platform & Community OpEx:
#     * Months 1–4 (Jan-27 to Apr-27, during core build) : 0.00 M VND/month (covered by dev task budgets)
#     * Months 5–6 (May-27 to Jun-27, migration/hypercare): 16.50 M VND/month (4.50M cloud + 2.20M OTP + 1.80M SaaS + 8.00M uni/community ops; engineering maintenance is already inside Stage 5–6 dev tasks)
#     * Month 7+ (Jul-27 to Dec-31, steady-state ops)    : 26.50 M VND/month (8.50M cloud/OTP/SaaS + 10.00M ongoing maintenance retainer + 8.00M uni/community ops)
