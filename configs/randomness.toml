# ==============================================================================
# CENTRAL CONFIGURATION: MONTE CARLO ENGINE & STOCHASTIC SHOCK DISTRIBUTIONS
# File: CaseComp/configs/randomness.toml
# Philosophy: Centralizes all random seeds, Monte Carlo trajectory counts,
#             train/test holdout splits, and multiplicative/additive random
#             shock distributions used across AdaptivePricing, PickSocialProjectTimeline,
#             and FinancialModel.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GLOBAL MONTE CARLO SIMULATION & HOLDOUT PARAMETERS
# Derivation:
#   - 300 independent monthly/multi-year Monte Carlo trajectories provide tight
#     standard errors (<0.3% SE on mean revenue/profit) while keeping full
#     pipeline execution under ~4 seconds via `uv run main`.
#   - 80% / 20% train/test holdout split (240 train trajectories / 60 held-out test
#     trajectories) evaluates out-of-sample generalization without data leakage.
# ------------------------------------------------------------------------------

[monte_carlo]
random_seed = 2026
n_simulations = 300                     # Number of Monte Carlo trajectories
train_fraction = 0.80                   # 80% train (240 sims), 20% held-out test (60 sims)
ci_low_percentile = 5.0                 # 5th percentile (P05 downside bound)
ci_high_percentile = 95.0               # 95th percentile (P95 upside bound)

# ------------------------------------------------------------------------------
# 2. COURT DEMAND STOCHASTIC SHOCK DISTRIBUTIONS (Used by AdaptivePricing)
# Derivation:
#   - Purely stochastic day-level and hour-level multiplicative shocks sampled
#     independently from Truncated Normal distributions centered at 1.00.
#   - Captures HCMC afternoon tropical rainstorms, payday spikes, and local
#     competitor promos without relying on rigid deterministic lookup arrays.
# ------------------------------------------------------------------------------

[daily_random_multiplier]
dist = "truncated_normal"
mean = 1.00
std = 0.055
min = 0.82
max = 1.18
unit = "dimensionless multiplier"
source = "Daily weather & local demand variance around Case Exhibit 1 regime means"

[hourly_random_shock]
dist = "truncated_normal"
mean = 1.00
std = 0.045
min = 0.85
max = 1.15
unit = "dimensionless multiplier"
source = "Hour-to-hour arrival jitter across 6 courts (06:00-22:00)"

# ------------------------------------------------------------------------------
# 3. FINANCIAL MODEL & SUBSCRIPTION COHORT RANDOM SHOCK DISTRIBUTIONS
# Derivation:
#   - In the 60-month (5-year) FinancialModel Monte Carlo simulation, each trajectory
#     samples monthly shocks to unique customers, churn rate, new subscriber
#     acquisition rate, ancillary revenue, and variable costs.
# ------------------------------------------------------------------------------

[monthly_demand_macro_shock]
# Month-to-month macro demand fluctuation around baseline (1.00 +/- 3.0%)
dist = "truncated_normal"
mean = 1.00
std = 0.030
min = 0.90
max = 1.10
unit = "dimensionless multiplier"
source = "Monthly seasonal & macro sports participation variance in Ho Chi Minh City"

[subscriber_acquisition_random_shock]
# Multiplicative shock applied to monthly new-subscriber conversion rate
dist = "truncated_normal"
mean = 1.00
std = 0.075
min = 0.78
max = 1.22
unit = "dimensionless multiplier"
source = "Stochastic viral/word-of-mouth variance in monthly PICK! Social sign-ups"

[subscriber_churn_random_shock]
# Multiplicative shock applied to monthly membership churn rate
dist = "truncated_normal"
mean = 1.00
std = 0.080
min = 0.76
max = 1.25
unit = "dimensionless multiplier"
source = "Month-to-month retention variance (exam periods, Tet holidays, weather)"

[ancillary_revenue_random_shock]
# Multiplicative shock on monthly Paddle/Balls (15M), Coaching (115M), and F&B (75M) revenue
dist = "truncated_normal"
mean = 1.00
std = 0.035
min = 0.88
max = 1.12
unit = "dimensionless multiplier"
source = "Monthly variance in on-site coaching clinics, paddle rentals, and cafe spend"

[payment_gateway_cash_mix_shock]
# Very tight multiplicative shock on effective payment processing fee % as cash vs. QR/card mix shifts
dist = "truncated_normal"
mean = 1.00
std = 0.030
min = 0.91
max = 1.09
unit = "dimensionless multiplier"
source = "Tight monthly fluctuation in cash vs. VietQR/VNPay/MoMo checkout mix"

# ------------------------------------------------------------------------------
# 4. CASE MANDATORY STRESS-TEST SCENARIO (-30% DEMAND SHOCK)
# Derivation:
#   - Case Page 4 ("Your task"): "show what happens if demand is 30% below your
#     plan, and what you would change."
#   - Case Page 5 ("Judging criteria"): "A realistic response to 30% lower demand."
# ------------------------------------------------------------------------------

[stress_test_scenario]
demand_drop_fraction = 0.30             # 30% lower demand stress scenario (0.70x baseline demand)
demand_multiplier = 0.70
source = "Case Page 4 & Page 5 ('show what happens if demand is 30% below your plan')"
