# ==============================================================================
# CENTRAL CONFIGURATION: CUSTOMERS, SEGMENTS, SOCIAL MEDIA FUNNEL,
#                        12 SEGMENT-BY-ANCILLARY SPENDING DISTRIBUTIONS &
#                        PATH C SUBSCRIPTIONS
# File: CaseComp/configs/customers.toml
# Philosophy: Every assumption is modeled as a probability distribution
#             (Truncated Normal / Beta) rather than a brittle static scalar.
#             Simulation trajectories sample from these distributions each month
#             and propagate state smoothly across the 60-month (2027–2031) horizon.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BASELINE MONTHLY UNIQUE CUSTOMERS, VISITS & FOLLOWER-TO-CUSTOMER FUNNEL
# Derivation & Explicit Team Assumption:
#   - Case Page 2 ("PICK! At a glance"):
#     * "3,600 unique customers; about 7,600 player visits; 1,150 free
#        registered accounts; 42,000 TikTok and Instagram followers."
#     * "Young customers find PICK! through friends, TikTok and Instagram."
#   - Case Exhibit 2 ("Monthly Costs"):
#     * "Marketing: Variable (PICK! chooses), VND 25 million."
#   - EXPLICIT TEAM ASSUMPTION (NOTED FOR PRESENTATION & FINANCIAL MODELING):
#     We assume that PICK!'s active monthly unique customers are strictly a
#     subset of its 42,000 TikTok and Instagram followers:
#       Follower-to-Customer Conversion Rate = 3,600 / 42,000 = 8.5714% (~8.57%)
#     Every month, active unique customers are drawn from the active social
#     follower pool via this conversion rate distribution (~8.57% mean).
#   - Merged Segment Monthly Visits Distributions:
#     Instead of maintaining separate static customer counts and visits/customer
#     multipliers where unnecessary, we merge customer count and visits/month
#     into direct monthly visits distributions for each of the 4 customer
#     segments (Competitive: 3,240 visits/mo, Social: 2,520 visits/mo,
#     Trend Explorers: 1,188 visits/mo, Families: 648 visits/mo; Total = 7,596
#     exact visits/mo ~ 7,600 reported in Case Page 2).
# ------------------------------------------------------------------------------

[unique_customers_monthly]
dist = "truncated_normal"
mean = 3600.0
std = 160.0
min = 3100.0
max = 4100.0
unit = "customers/month"
source = "Case Page 2 ('3,600 unique customers') & Exhibit 4"

[registered_accounts_initial]
# Case Exhibit 1: "1,150 free accounts (not paid memberships)" at start of Jan 2027
dist = "truncated_normal"
mean = 1150.0
std = 35.0
min = 1050.0
max = 1250.0
unit = "accounts"
source = "Case Exhibit 1 ('1,150 free accounts')"

[player_visits_per_month_anchor]
# Sum across the 4 merged segment monthly visit distributions:
#   3,240 (Competitive) + 2,520 (Social) + 1,188 (Trend Explorers) + 648 (Families)
#   = 7,596 exact visits/month (~7,600 reported in Case Page 2).
dist = "truncated_normal"
mean = 7596.0
std = 340.0
min = 6500.0
max = 8700.0
unit = "visits/month"
source = "Case Page 2 ('about 7,600 player visits') & Exhibit 4 (3,240 + 2,520 + 1,188 + 648 = 7,596)"

# ------------------------------------------------------------------------------
# 2. CUSTOMER SEGMENT DISTRIBUTIONS, MARKETING RESPONSE (VND/VISIT) &
#    12 SEGMENT-BY-ANCILLARY REVENUE SPENDING DISTRIBUTIONS (3 LINES x 4 SEGMENTS)
#
# Mathematical Grounding in Case Exhibit 1, Exhibit 2 & Exhibit 4:
#   A) Case Exhibit 4 Customer Segments (at 25,000,000 VND/month Baseline Marketing):
#      1) Competitive Players : 20% of 3,600 =   720 customers | 4.5 visits/mo = 3,240 visits/mo (42.65%) | 95,000 VND/visit total
#      2) Social Players      : 35% of 3,600 = 1,260 customers | 2.0 visits/mo = 2,520 visits/mo (33.18%) | 80,000 VND/visit total
#      3) Trend Explorers     : 30% of 3,600 = 1,080 customers | 1.1 visits/mo = 1,188 visits/mo (15.64%) | 65,000 VND/visit total
#      4) Families            : 15% of 3,600 =   540 customers | 1.2 visits/mo =   648 visits/mo ( 8.53%) | 85,000 VND/visit total
#      -------------------------------------------------------------------------------------------------------------------------
#      Total Baseline         : 100%         = 3,600 customers | 2.11 visits/mo = 7,596 visits/mo (100.0%) | 641.70M VND/mo (~640M Exhibit 1)
#
#   B) Baseline 25.00M VND/Month Marketing Split & Marketing VND Required per Visit:
#      Splitting the current 25,000,000 VND/month marketing spend across the 4
#      customer segments yields the exact VND marketing cost per player visit:
#      1) Competitive Players : 20.0% of budget = 5.00M VND/mo -> 5,000,000 / 3,240 = 1,543.21 VND / visit (6,944.4 VND / customer)
#         * Lowest marketing cost per visit because once acquired via tournament/league
#           content, competitive players return organically 4.5 times/month.
#      2) Social Players      : 34.0% of budget = 8.50M VND/mo -> 8,500,000 / 2,520 = 3,373.02 VND / visit (6,746.0 VND / customer)
#         * Core group-play audience acquired via Instagram/TikTok social reels & friend referrals; visits 2.0x/month.
#      3) Trend Explorers     : 30.0% of budget = 7.50M VND/mo -> 7,500,000 / 1,188 = 6,313.13 VND / visit (6,944.4 VND / customer)
#         * Highest marketing cost per visit (4.09x Competitive!) because viral TikTok
#           ads attract one-time curiosity seekers who only visit 1.1 times/month
#           (Case Page 2: "Viral content can bring in first-time visitors without turning them into regulars").
#      4) Families            : 16.0% of budget = 4.00M VND/mo -> 4,000,000 /   648 = 6,172.84 VND / visit (7,407.4 VND / customer)
#         * Local neighborhood/school parent outreach; higher acquisition cost per visit
#           (1.2 visits/mo) but generates the highest ancillary coaching & F&B margin per visit.
#      Sum of 4 Segment Marketing Budgets = 5.00M + 8.50M + 7.50M + 4.00M = 25.00M VND/month (Exact Case Exhibit 2!).
#
#   C) Grounding the 12 Segment-by-Ancillary Spending Distributions (3 Ancillary Lines x 4 Segments):
#      Case Exhibit 1 reports 3 ancillary revenue lines alongside Court Hire (435.00M VND):
#        - Revenue Line 2: Paddle rental and balls =  15.00M VND/month ( 1.975 kVND/visit average across 7,596 visits)
#        - Revenue Line 3: Coaching                = 115.00M VND/month (15.140 kVND/visit average across 7,596 visits)
#        - Revenue Line 4: Food and drinks         =  75.00M VND/month ( 9.874 kVND/visit average across 7,596 visits)
#        - Total Ancillary Revenue                 = 205.00M VND/month (26.988 kVND/visit average across 7,596 visits)
#      Simultaneously, Case Exhibit 4 requires each segment's total spend per visit
#      (Court Hire + Paddle/Balls + Coaching + Food & Drinks) to equal:
#        - Competitive     : 95.00 kVND/visit = 62.90 kVND Court Hire + 32.10 kVND Ancillary ( 0.80k Paddle/Balls + 21.30k Coaching + 10.00k F&B)
#        - Social          : 80.00 kVND/visit = 57.38 kVND Court Hire + 22.62 kVND Ancillary ( 1.60k Paddle/Balls +  9.52k Coaching + 11.50k F&B)
#        - Trend Explorers : 65.00 kVND/visit = 49.01 kVND Court Hire + 15.99 kVND Ancillary ( 5.20k Paddle/Balls +  4.80k Coaching +  5.99k F&B)
#        - Families        : 85.00 kVND/visit = 46.42 kVND Court Hire + 38.58 kVND Ancillary ( 3.40k Paddle/Balls + 25.15k Coaching + 10.03k F&B)
#      Exact Reconciliation to Case Exhibit 1 at Baseline Visits (3,240 | 2,520 | 1,188 | 648):
#        1) Paddle Rental & Balls : 3,240*0.80k (2.592M) + 2,520*1.60k (4.032M) + 1,188*5.20k (6.178M) + 648*3.40k (2.203M) =  15.005M VND/mo (~15.00M Exhibit 1!)
#        2) Coaching              : 3,240*21.30k (69.012M) + 2,520*9.52k (23.990M) + 1,188*4.80k (5.702M) + 648*25.15k (16.297M) = 115.001M VND/mo (~115.00M Exhibit 1!)
#        3) Food & Drinks (F&B)   : 3,240*10.00k (32.400M) + 2,520*11.50k (28.980M) + 1,188*5.99k (7.116M) + 648*10.03k (6.499M) =  74.995M VND/mo (~75.00M Exhibit 1!)
# ------------------------------------------------------------------------------

