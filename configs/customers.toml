# 5. PATH C MEMBERSHIP SUBSCRIPTION STATE-TRANSITION MODEL (Starts Month 5: May-27)
# Derivation:
#   - Case Page 3 (Path C: Build a membership and community network):
#     * "Members pay VND 399,000 a month; court hire is extra unless your team
#        includes it and budgets for it."
#     * "Revenue assumption: 1,500 paying members by the end of year two. At
#        VND 399,000 each, that equals about VND 598.5 million in monthly
#        membership revenue before partner-court, event and service costs."
#   - Timeline Integration:
#     * Months 1–4 (Jan-27 to Apr-27): Core platform is under development (Stages 1–4).
#       Active paying members = 0 (Membership revenue = 0.0 M VND).
#     * Month 5 (May-27, index 4): Platform completes UAT at end of Month 4 (Apr 25, 2027)
#       and launches in Month 5 (Stage 5 soft-launch & cutover).
#       Initial launch subscribers in Month 5 are drawn from the 1,150 registered
#       accounts & 3,600 monthly unique players via:
#         S_5 = U_5 * membership_stated_intent_rate * launch_month_conversion_fraction
#             ~ 3,600 * 0.31 * 0.28 ~ 312 paying members in Month 5 (May-27).
#     * Smooth Month-to-Month State Evolution (for t >= 6, Jun-27 to Dec-31):
#       Rather than sampling subscribers independently (which would jump erratically),
#       subscribers evolve smoothly via the Markov stock-flow identity:
#         Churned_t = S_{t-1} * churn_rate_t
#         NewSubs_t = NonSubscribedUniquePool_t * new_sub_rate_t * (1 - S_{t-1} / addressable_cap)
#         S_t       = S_{t-1} - Churned_t + NewSubs_t
# ------------------------------------------------------------------------------

[membership_program]
launch_month_index = 5                  # 1-based month index: Month 5 = May-27 (after 4-month core build)
launch_month_label = "May-27"
monthly_fee_kvnd = 399.0                # Case Page 3 & Exhibit 3: VND 399,000 / month
monthly_fee_mvnd = 0.399                # 0.399 Million VND / paying member / month
case_year2_target_members = 1500.0      # Case Page 3 working assumption: 1,500 paying members by end of Y2
case_year2_target_rev_mvnd = 598.50     # 1,500 * 0.399M = 598.50 M VND/month

