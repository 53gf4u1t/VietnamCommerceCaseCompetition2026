# ------------------------------------------------------------------------------
# 4. DERIVED MUTUAL DEMAND PILLARS (CROSS-SEGMENT CUSTOMER NEEDS)
# ------------------------------------------------------------------------------
[[mutual_demand_pillars]]
pillar_id = "skill_matching"
pillar_name = "1. Frictionless 4-Player Skill Matching & Open Play Liquidity"
segments_served = "All 4 Segments (100% of Customers)"
customer_friction = "Manual group coordination, last-minute 4th-player dropouts, and intimidating skill mismatches on court."
mutual_need_statement = "Players across every tier need effortless, level-appropriate game matching so solo players, beginners, and 3-person crews can always play a balanced 4-player game."

[[mutual_demand_pillars]]
pillar_id = "daytime_affordability"
pillar_name = "2. Accessible Off-Peak Daytime Rates & Peak Court Availability"
segments_served = "Trend Explorers (30%), Social Players (35%), Competitive Players (20%)"
customer_friction = "Static 160k VND/hour weekday daytime rates price out flexible students (leaving 60% of daytime courts empty), while 95% evening congestion turns away peak groups."
mutual_need_statement = "Price-elastic daytime players need affordable off-peak access (06:00-17:00), while after-work regulars need relief from evening and weekend court bottlenecks."

[[mutual_demand_pillars]]
pillar_id = "structured_progression"
pillar_name = "3. Structured Beginner-to-Competitive Skill Progression"
segments_served = "Trend Explorers (30%), Families (15%), Competitive Players (20%)"
customer_friction = "First-timers (1.1 visits/month) and Families (1.2 visits/month) lack a clear pathway from their first viral trial to confident regular play."
mutual_need_statement = "Beginners and families need welcoming introductory clinics and guided games, while competitive players need advanced drills and seasonal tournament benchmarks."

[[mutual_demand_pillars]]
pillar_id = "social_third_place"
pillar_name = "4. Welcoming Social 'Third-Place' Community & Regular Recognition"
segments_served = "Social Players (35%), Competitive Players (20%), Trend Explorers (30%), Families (15%)"
customer_friction = "1,150 free registered accounts experience purely transactional walk-in bookings with zero community identity or loyalty privileges against cheaper local rivals."
mutual_need_statement = "Customers want more than bare concrete courts: they want a vibrant social clubhouse (specialty drinks, post-match hangout, and member recognition) that rewards repeat play."
