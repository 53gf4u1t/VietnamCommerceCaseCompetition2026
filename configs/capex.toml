# ==============================================================================
# CENTRAL CONFIGURATION: CAPITAL EXPENDITURES (CapEx), VENUE SCALING
#                        (6 -> 20 COURTS STARTING Q4 2027), BALANCE SHEET & TAX
# File: configs/capex.toml
# Philosophy: Configures the 14-court venue expansion (expanding PICK! from 6 courts to
#             20 courts total by opening a second 14-court club in Ho Chi Minh
#             City starting Q4 2027 / Month 10: Oct 2027, after 4 months of
#             platform development [M1-M4] and 5 months of live platform
#             operation [M5-M9]).
#             - Total fit-out & launch CapEx = VND 7,000.0M (7.0 billion VND,
#               preset by Case Page 3), split EVENLY across the 4 researched
#               construction months (Oct-27 to Jan-28): 7,000.0M / 4 = 1,750.0M/mo.
#             - Second club lease = VND 330.0M/month on a 5-year lease (preset
#               by Case Page 3).
#             - DO NOT use the Case's static 1.5B/month revenue estimate;
#               instead, once construction finishes at the end of Month 13
#               (Jan-28), total capacity scales from 6 courts to 20 courts
#               (Month 14 / Feb-28 onward), and the new 14 courts ramp up over
#               a stochastic 6-to-9 month fill-up distribution using OUR model
#               (AdaptivePricing court hire + ancillary + PICK! Social network).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. VENUE SCALING (14-COURT SECOND CLUB IN HCMC, Q4 2027)
# Derivation from Case Page 3 & Civil/Sports Construction Benchmarks:
#   - Case Page 3 ("Expand the club network"):
#     * "Open a second club in Ho Chi Minh City with 14 courts, coaching
#        facilities and a cafe, on a five-year lease of about VND 330 million
#        a month."
#     * "New clubs usually take six to nine months to fill up."
#     * "Investment: VND 7 billion for fit-out and launch, plus VND 1 billion
#        in reserve."
#     * "Do not use our VND 1.5B revenue est, use OUR model to estimate (earlier
#        it was 6, WHEN IT IS DONE, it's 20 courts)."
#   - Strategic Sequencing:
#     * Months 1-4 (Jan-Apr 2027): Build custom PICK! Social & AdaptivePricing
#       platform.
#     * Months 5-9 (May-Sep 2027): Launch platform & operate for 5 months,
#       proving out higher court utilization, membership cash flow, and
#       waitlist demand to justify physical expansion.
#     * Months 10-13 (Oct 2027 - Jan 2028, Start of Q4 2027 = 4.0 Months / 16.0 Weeks):
#       Execute the 14-court commercial fit-out & construction in HCMC. Why
#       4.0 months (16.0 weeks)? Commercial pickleball slab engineering
#       (ASBA / PickleTile / Endurance Courts) requires 2-3 weeks of sub-base
#       laser grading & post-tensioned concrete pouring, followed by a MANDATORY
#       28-to-35 day (4.0-5.0 week) concrete moisture curing & vapor-emission
#       window before 100% acrylic silica-sand surfacing can be applied (Weeks
#       9-14), while MEP rough-in, cafe/coaching studio carpentry, acoustic
#       baffles, and Vietnam PCCC fire safety inspection run in parallel,
#       concluding in Week 16 (end of Jan 2028 / Month 13).
#     * Month 14+ (Feb 2028 onward): Venue 2 opens! Total network capacity jumps
#       from 6 courts to 20 courts (6 + 14 = 20 courts, +233.33% capacity).
#       Utilization of the 14 new courts ramps smoothly over a sampled 6-to-9
#       month fill-up window (Feb 2028 - Aug/Oct 2028), reaching 100% steady-state
#       well ahead of Investor Minh Tran's Year 3 (FY 2029) deadline.
# ------------------------------------------------------------------------------

[venue_scaling]
enabled = true
project_name = "PICK! Club #2 - 14-Court HCMC Flagship Venue Expansion (Path A)"
company = "PICK! Pickleball Club (Ho Chi Minh City)"
existing_courts = 6
new_venue_courts = 14
total_expanded_courts = 20               # 6 existing + 14 new = 20 courts total (+233.33% capacity)
capacity_ratio_new_vs_existing = 2.3333333333333335  # 14 / 6 = 2.3333x existing venue capacity
capacity_ratio_total_vs_existing = 3.3333333333333335 # 20 / 6 = 3.3333x existing venue capacity

# Calendar & Month Index Schedule (1-based month index where Month 1 = Jan-27)
build_start_date = "2027-10-04"          # First Monday of Q4 2027 (Oct 2027)
build_start_month_index = 10             # Month 10 = Oct-27 (Start of Q4 2027, after 4M build + 5M live ops)
build_start_month_label = "Oct-27"
build_duration_months = 4                # 4.0 months (16.0 weeks): Oct-27, Nov-27, Dec-27, Jan-28 (Months 10..13)
build_duration_weeks = 16.0              # Weeks 1..16 of Q4 2027 - Jan 2028
build_end_month_index = 13               # Month 13 = Jan-28
build_end_month_label = "Jan-28"
open_month_index = 14                    # Month 14 = Feb-28 (20 courts active from Feb-28 onward!)
open_month_label = "Feb-28"
total_timeline_horizon_weeks = 48.0      # 16 weeks build (Oct 2027 - Jan 2028) + 32 weeks (~7.5-8 mo) fill-up window (Feb-Sep 2028)

# Preset Case Page 3 Investment & Lease Parameters (Staged 2-Tranche Drawdown of 8,000.0M VND)
total_fitout_capex_mvnd = 7000.00        # VND 7.0 billion preset by Case Page 3 for fit-out and launch
even_monthly_fitout_capex_mvnd = 1750.00 # 7,000.00M / 4 build months = 1,750.00M VND/month across M10..M13
even_weekly_fitout_capex_mvnd = 437.50   # 7,000.00M / 16 build weeks = 437.50M VND/week
investor_total_new_money_mvnd = 8000.00  # VND 8.0 billion total investor funding available (Case Page 1 & 4)
investor_reserve_mvnd = 1000.00          # VND 1.0 billion kept in cash reserve (Case Page 3 & 4: 500M drawn M1 + 500M drawn M10)
investor_signing_tranche_month_index = 1 # Tranche 1 drawn upon signing in Month 1 (Jan-27)
investor_signing_tranche_mvnd = 500.00   # VND 500.0M drawn in Month 1 (Jan-27) to fortify early build reserve
investor_equity_injection_month_index = 10 # Tranche 2 drawn at Q4 2027 expansion kickoff (Month 10 / Oct-27)
investor_expansion_tranche_mvnd = 7500.00 # VND 7,500.0M drawn in Month 10 (Oct-27): 7,000M fit-out + remaining 500M reserve
new_venue_lease_monthly_mvnd = 330.00    # VND 330 million/month on 5-year lease (Case Page 3)
lease_start_month_index = 10             # Lease commences upon site handover in Month 10 (Oct-27)
case_static_ref_new_club_rev_mvnd = 1500.00 # Case Page 3 reference only (NOT used in our model; we use OUR 20-court model)

# Stochastic 6-to-9 Month Fill-Up Duration Distribution (Case Page 3: "New clubs usually take six to nine months to fill up")
[venue_scaling.fill_up_duration_months_dist]
dist = "truncated_normal"
mean = 7.50
std = 0.75
min = 6.00
max = 9.00
unit = "months to reach 100% steady-state utilization after opening in Month 14 (Feb-28)"
source = "Case Page 3 ('New clubs usually take six to nine months to fill up')"

# Initial Month-14 (Feb-28) Grand-Opening Utilization Fraction of Steady-State (Pre-seeded by PICK! Social waitlist & leagues)
[venue_scaling.initial_open_utilization_fraction_dist]
dist = "truncated_normal"
mean = 0.28
std = 0.04
min = 0.18
max = 0.38
unit = "fraction of steady-state 14-court capacity booked in opening Month 14 (Feb-28)"
source = "Pre-registration via PICK! Social app (active since May-27) & university league overflow"

# Addressable Membership Pool Expansion Multiplier when Scaling from 6 Courts (1 Club) to 20 Courts (2 Clubs)
# Opening a second 14-court flagship club in a new HCMC district expands PICK!'s total unique player catchment
# and addressable membership ceiling by +115% (from ~2,480 on 1 club to ~5,330 across the 20-court 2-club network).
[venue_scaling.network_customer_catchment_expansion_dist]
dist = "truncated_normal"
mean = 2.15
std = 0.12
min = 1.85
max = 2.45
unit = "multiplier on total 2-club unique customer catchment & membership ceiling at full 20-court fill-up"
source = "Derived from scaling 6 courts to 20 courts (3.33x capacity) across 2 HCMC districts with cross-club overlap"

